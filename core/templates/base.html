<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HamroPhysio - Expert Physiotherapy in Birgunj & Bara{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: #FDFBF8; }
        .serif { font-family: 'Playfair Display', serif; }
        .gold-bg { background: linear-gradient(135deg, #D4AF37 0%, #F9E076 100%); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); } 70% { box-shadow: 0 0 0 14px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
        .wa-float { animation: pulse 1.8s infinite; }
        .message { padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Messages -->
    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }} max-w-7xl mx-auto mt-4 px-5">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    
    {% block content %}{% endblock %}
    
    <script>
        // Auto hide messages after 5 seconds
        setTimeout(() => {
            document.querySelectorAll('.message').forEach(msg => {
                msg.style.display = 'none';
            });
        }, 5000);
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
