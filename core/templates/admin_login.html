<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - HamroPhysio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #1E3A2F 0%, #2B5A44 100%); font-family: 'Inter', sans-serif;">
    <div class="min-h-screen flex items-center justify-center p-5">
        <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-[#1E3A2F]">HamroPhysio</h1>
                <p class="text-gray-500 mt-2">Admin Login</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-5">
                    <label class="block text-gray-700 mb-2">Username</label>
                    <input type="text" name="username" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-[#1E3A2F]" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-[#1E3A2F]" required>
                </div>
                <button type="submit" class="w-full bg-[#1E3A2F] text-white py-3 rounded-xl font-semibold hover:bg-[#2B5A44] transition">Login</button>
            </form>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="mt-4 p-3 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
        </div>
    </div>
</body>
</html>
