<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HamroPhysio Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #F5F3EF; font-family: 'Inter', sans-serif; }
        .sidebar { background: #1E3A2F; }
    </style>
</head>
<body>
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <div class="sidebar text-white w-64">
            <div class="p-6 border-b border-white/20">
                <h2 class="text-2xl font-bold">HamroPhysio</h2>
                <p class="text-sm opacity-75">Admin Panel</p>
            </div>
            <nav class="p-4 space-y-2">
                <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition">📊 Dashboard</a>
                <a href="{% url 'admin_bookings' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition">📅 Bookings</a>
                <a href="{% url 'admin_patients' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition">👥 Patients</a>
                <a href="{% url 'admin_earnings' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition">💰 Earnings</a>
                <a href="{% url 'admin_partnerships' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition">🤝 Partnerships</a>
                <a href="{% url 'admin_settings' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/10 transition">⚙️ Settings</a>
                <hr class="border-white/20 my-4">
                <a href="{% url 'admin_logout' %}" class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-600/30 transition">🚪 Logout</a>
            </nav>
        </div>
        
        <!-- Main Content -->
        <div class="flex-1">
            <header class="bg-white shadow-sm p-4">
                <h1 class="text-xl font-semibold">{% block header %}Dashboard{% endblock %}</h1>
            </header>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="m-4 p-4 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
